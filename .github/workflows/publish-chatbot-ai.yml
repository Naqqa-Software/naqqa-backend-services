name: Publish Naqqa Chatbot to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'chatbot-ai/**'
      - '.github/workflows/publish-chatbot-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-chatbot-ai
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chatbot-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "https://maven.pkg.github.com/Naqqa-Software/naqqa-backend-services/com/naqqa/naqqa-chatbot/$VERSION/naqqa-chatbot-$VERSION.jar")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Skip already published version
        if: steps.check.outputs.exists == 'true'
        run: echo "naqqa-chatbot ${{ steps.check.outputs.version }} is already published; bump the version in chatbot-ai/pom.xml to publish new changes"

      - name: Build & Deploy
        if: steps.check.outputs.exists != 'true'
        run: mvn --batch-mode clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
